name: iOS TestFlight Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build & TestFlight'a Yukle
    runs-on: macos-15

    env:
      FLUTTER_VERSION: "3.24.5"

    steps:
      - name: Kaynak kodu klonla
        uses: actions/checkout@v4

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter surumunu dogrula
        run: flutter --version

      - name: Flutter paketlerini indir
        run: flutter pub get

      - name: Ruby kurulumu
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Sertifika ve provisioning profile kurulumu
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/planora_appstore.mobileprovision"

          echo "Imzalama materyalleri basariyla kuruldu."

      - name: iOS IPA build
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: App Store Connect API Key hazirla
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode \
            -o "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: TestFlight'a yukle
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
          IPA_PATH: ${{ github.workspace }}/build/ios/ipa/planora.ipa
        run: |
          bundle exec fastlane beta

      - name: IPA'yi artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planora-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 7
